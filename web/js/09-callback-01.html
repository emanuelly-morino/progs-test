<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
</head>

<body>
    Random numbers:
    <p id="numbers">
    </p>

    <script>

        // função callback
        function sayGoodbye() {
            console.log("Goodbye!");
        }

        // função principal
        function cumprimentar(nome, callback) {
            console.log(`Hello, ${nome}!`);
            // invocar a função callback
            callback();
        }

        // executar a função principal :-)
        cumprimentar("Alice", sayGoodbye);
        cumprimentar("John", sayGoodbye);

    </script>

</body>

</html>
